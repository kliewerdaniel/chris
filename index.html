<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chris</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: linear-gradient(-45deg, #000000, #222222, #444444, #666666, #888888, #aaaaaa, #000000);
            background-size: 400% 400%;
            animation: gradientShift 12s ease infinite;
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 80%, rgba(255, 255, 255, 0.2) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(255, 255, 255, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 40% 40%, rgba(255, 255, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 60% 60%, rgba(100, 100, 100, 0.15) 0%, transparent 50%);
            animation: floatOrbs 18s ease-in-out infinite alternate;
            z-index: -1;
            pointer-events: none;
        }

        body::after {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background-image: 
                repeating-conic-gradient(from 0deg, 
                    transparent 0deg 30deg, 
                    rgba(255, 255, 255, 0.03) 30deg 60deg);
            animation: rotatePattern 60s linear infinite;
            z-index: -1;
            pointer-events: none;
            mix-blend-mode: overlay;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes floatOrbs {
            0% { 
                transform: translate(0, 0) scale(1);
                filter: blur(0px);
            }
            50% { 
                transform: translate(30px, -20px) scale(1.1);
                filter: blur(10px);
            }
            100% { 
                transform: translate(-20px, 20px) scale(0.95);
                filter: blur(5px);
            }
        }

        @keyframes rotatePattern {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            box-shadow: 0 0 80px rgba(0, 0, 0, 0.3);
        }

        .header {
            padding: 20px;
            border-bottom: 1px solid #1e293b;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 1.5rem;
            font-weight: 500;
        }

        #reset-btn {
            background: #334155;
            border: none;
            color: #cbd5e1;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
        }

        #reset-btn:hover {
            background: #475569;
        }

        #memory-badge {
            background: #1e293b;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.9rem;
            cursor: pointer;
            user-select: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #memory-badge:hover {
            background: #334155;
        }

        .context-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            transition: background-color 0.3s ease;
        }

        .context-dot.low { background-color: #22c55e; }
        .context-dot.medium { background-color: #eab308; }
        .context-dot.high { background-color: #ef4444; }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-btn {
            background: #334155;
            border: none;
            color: #cbd5e1;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .header-btn:hover {
            background: #475569;
        }

        .persona-panel {
            background: rgba(30, 41, 59, 0.95);
            border-bottom: 1px solid #334155;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }

        .persona-panel.open {
            max-height: 500px;
        }

        .persona-content {
            padding: 12px 20px;
        }

        .persona-content textarea {
            width: 100%;
            min-height: 250px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            color: #e2e8f0;
            padding: 12px;
            font-family: monospace;
            font-size: 0.8rem;
            resize: vertical;
            margin-bottom: 12px;
        }

        .persona-actions {
            display: flex;
            gap: 12px;
        }

        .memory-panel {
            background: rgba(30, 41, 59, 0.95);
            border-bottom: 1px solid #334155;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }

        .memory-panel.open {
            max-height: 300px;
            overflow-y: auto;
        }

        .memory-item {
            padding: 8px 20px;
            font-size: 0.85rem;
            border-bottom: 1px solid rgba(51, 65, 85, 0.3);
        }

        .memory-item:last-child {
            border-bottom: none;
        }

        .memory-key {
            font-weight: 600;
            color: #94a3b8;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal {
            background: #1e293b;
            padding: 24px;
            border-radius: 12px;
            max-width: 400px;
            width: 90%;
        }

        .modal h3 {
            margin-bottom: 16px;
        }

        .modal-buttons {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        .modal-btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .modal-btn.cancel {
            background: #334155;
            color: #e2e8f0;
        }

        .modal-btn.chat-only {
            background: #3b82f6;
            color: white;
        }

        .modal-btn.everything {
            background: #ef4444;
            color: white;
        }

        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 16px;
            line-height: 1.5;
        }

        .user {
            background: #ffffff;
            color: #000000;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .assistant {
            background: #1e293b;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .input-area {
            padding: 20px;
            border-top: 1px solid #1e293b;
        }

        .input-wrapper {
            display: flex;
            gap: 12px;
        }

        #message-input {
            flex: 1;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 14px 16px;
            color: #e2e8f0;
            font-size: 1rem;
            outline: none;
        }

        #message-input:focus {
            border-color: #ffffff;
        }

        #send-btn {
            background: #ffffff;
            border: none;
            color: #000000;
            padding: 0 24px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 500;
        }

        #send-btn:disabled {
            background: #334155;
            cursor: not-allowed;
        }

        .status {
            font-size: 0.85rem;
            color: #64748b;
            margin-top: 8px;
        }

        .playing-indicator {
            font-size: 0.8rem;
            color: #ffffff;
            margin-top: 6px;
        }

        audio {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div style="display: flex; align-items: center; gap: 12px;">
                <h1>Chris</h1>
                <div id="context-dot" class="context-dot low" title="Context status"></div>
            </div>
            
            <div class="header-right">
                <button id="export-btn" class="header-btn">📥 Export</button>
                <button id="persona-btn" class="header-btn">✏️ Persona</button>
                <div id="memory-badge">🧠 <span id="memory-count">0</span> memories</div>
                <button id="reset-btn">Reset</button>
            </div>
        </div>

        <div id="memory-panel" class="memory-panel"></div>
        
        <div id="persona-panel" class="persona-panel">
            <div class="persona-content">
                <textarea id="persona-editor"></textarea>
                <div class="persona-actions">
                    <button id="persona-save" class="modal-btn chat-only">Save Persona</button>
                    <button id="persona-cancel" class="modal-btn cancel">Cancel</button>
                </div>
            </div>
        </div>
        
        <div id="chat-container"></div>
        
        <div class="input-area">
            <div class="input-wrapper">
                <input id="message-input" type="text" placeholder="Type a message..." autocomplete="off">
                <button id="send-btn">Send</button>
            </div>
            <div class="status" id="status"></div>
        </div>
    </div>

    <audio id="audio-player"></audio>

    <div id="reset-modal" class="modal-overlay">
        <div class="modal">
            <h3>Reset Confirmation</h3>
            <p>What would you like to reset?</p>
            <div class="modal-buttons">
                <button class="modal-btn cancel">Cancel</button>
                <button class="modal-btn chat-only">Reset Chat Only</button>
                <button class="modal-btn everything">Reset Chat + Memories</button>
            </div>
        </div>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const messageInput = document.getElementById('message-input');
        const sendBtn = document.getElementById('send-btn');
        const resetBtn = document.getElementById('reset-btn');
        const statusEl = document.getElementById('status');
        const audioPlayer = document.getElementById('audio-player');
        const memoryBadge = document.getElementById('memory-badge');
        const memoryCount = document.getElementById('memory-count');
        const memoryPanel = document.getElementById('memory-panel');
        const resetModal = document.getElementById('reset-modal');
        const contextDot = document.getElementById('context-dot');
        const exportBtn = document.getElementById('export-btn');
        const personaBtn = document.getElementById('persona-btn');
        const personaPanel = document.getElementById('persona-panel');
        const personaEditor = document.getElementById('persona-editor');
        const personaSave = document.getElementById('persona-save');
        const personaCancel = document.getElementById('persona-cancel');

        let isProcessing = false;

        function addMessage(text, isUser) {
            const msg = document.createElement('div');
            msg.className = `message ${isUser ? 'user' : 'assistant'}`;
            msg.textContent = text;
            chatContainer.appendChild(msg);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return msg;
        }

        function setStatus(text) {
            statusEl.textContent = text;
        }

        async function sendMessage() {
            if (isProcessing) return;
            
            const message = messageInput.value.trim();
            if (!message) return;

            isProcessing = true;
            sendBtn.disabled = true;
            messageInput.value = '';

            addMessage(message, true);
            setStatus('Thinking...');

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message })
                });

                if (!response.ok) throw new Error('Request failed');

                const data = await response.json();
                
                setStatus('Generating voice...');
                
                const assistantMsg = addMessage(data.text, false);
                
                // Play audio
                audioPlayer.src = data.audio_url;
                audioPlayer.play();
                
                const indicator = document.createElement('div');
                indicator.className = 'playing-indicator';
                indicator.textContent = '🔊 Speaking...';
                assistantMsg.appendChild(indicator);

                audioPlayer.onended = () => {
                    indicator.remove();
                };

                setStatus('');

            } catch (error) {
                addMessage('Sorry, something went wrong. Please try again.', false);
                setStatus('Error: ' + error.message);
            } finally {
                isProcessing = false;
                sendBtn.disabled = false;
                messageInput.focus();
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        async function fetchMemories() {
            try {
                const res = await fetch('/memories');
                const memories = await res.json();
                const count = Object.keys(memories).length;
                
                memoryCount.textContent = count;
                
                // Update memory panel
                memoryPanel.innerHTML = '';
                for (const [key, value] of Object.entries(memories)) {
                    const item = document.createElement('div');
                    item.className = 'memory-item';
                    item.innerHTML = `<span class="memory-key">${key}:</span> ${value}`;
                    memoryPanel.appendChild(item);
                }
            } catch (e) {
                memoryCount.textContent = '?';
            }
        }

        // Toggle memory panel
        memoryBadge.addEventListener('click', () => {
            memoryPanel.classList.toggle('open');
        });

        // Reset button with confirmation modal
        resetBtn.addEventListener('click', () => {
            resetModal.classList.add('show');
        });

        resetModal.querySelector('.cancel').addEventListener('click', () => {
            resetModal.classList.remove('show');
        });

        resetModal.querySelector('.chat-only').addEventListener('click', async () => {
            resetModal.classList.remove('show');
            await fetch('/reset', { method: 'DELETE' });
            chatContainer.innerHTML = '';
            setStatus('Conversation reset');
        });

        resetModal.querySelector('.everything').addEventListener('click', async () => {
            resetModal.classList.remove('show');
            await fetch('/reset', { method: 'DELETE' });
            await fetch('/reset_memories', { method: 'DELETE' });
            chatContainer.innerHTML = '';
            fetchMemories();
            setStatus('Chat and memories reset');
        });

        // Fetch memories on load and after each message
        fetchMemories();

        async function updateContextStatus() {
            try {
                const res = await fetch('/context_status');
                const status = await res.json();
                
                contextDot.className = `context-dot ${status.pressure}`;
                contextDot.title = `Context: ${status.percentage}% full (${status.used_tokens}/${status.max_tokens} tokens)`;
            } catch (e) {}
        }

        exportBtn.addEventListener('click', () => {
            window.open('/export', '_blank');
        });

        personaBtn.addEventListener('click', async () => {
            if (personaPanel.classList.contains('open')) {
                personaPanel.classList.remove('open');
            } else {
                try {
                    const res = await fetch('/persona');
                    const persona = await res.json();
                    personaEditor.value = JSON.stringify(persona, null, 2);
                    personaPanel.classList.add('open');
                } catch (e) {
                    setStatus('Failed to load persona');
                }
            }
        });

        personaCancel.addEventListener('click', () => {
            personaPanel.classList.remove('open');
        });

        personaSave.addEventListener('click', async () => {
            try {
                const persona = JSON.parse(personaEditor.value);
                await fetch('/persona', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(persona)
                });
                setStatus('Persona updated successfully');
                personaPanel.classList.remove('open');
            } catch (e) {
                setStatus('Invalid JSON or failed to save');
            }
        });

        // Update context status on load, every 10 seconds, and after each message
        updateContextStatus();
        setInterval(updateContextStatus, 10000);

        // Wrap sendMessage once to update status after messages
        const originalSendMessage = sendMessage;
        sendMessage = async function() {
            await originalSendMessage.apply(this, arguments);
            fetchMemories();
            updateContextStatus();
        };

        messageInput.focus();
    </script>
</body>
</html>
