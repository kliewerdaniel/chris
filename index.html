<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chris</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: linear-gradient(-45deg, #000000, #222222, #444444, #666666, #888888, #aaaaaa, #000000);
            background-size: 400% 400%;
            animation: gradientShift 12s ease infinite;
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 80%, rgba(255, 255, 255, 0.2) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(255, 255, 255, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 40% 40%, rgba(255, 255, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 60% 60%, rgba(100, 100, 100, 0.15) 0%, transparent 50%);
            animation: floatOrbs 18s ease-in-out infinite alternate;
            z-index: -1;
            pointer-events: none;
        }

        body::after {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background-image: 
                repeating-conic-gradient(from 0deg, 
                    transparent 0deg 30deg, 
                    rgba(255, 255, 255, 0.03) 30deg 60deg);
            animation: rotatePattern 60s linear infinite;
            z-index: -1;
            pointer-events: none;
            mix-blend-mode: overlay;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes floatOrbs {
            0% { 
                transform: translate(0, 0) scale(1);
                filter: blur(0px);
            }
            50% { 
                transform: translate(30px, -20px) scale(1.1);
                filter: blur(10px);
            }
            100% { 
                transform: translate(-20px, 20px) scale(0.95);
                filter: blur(5px);
            }
        }

        @keyframes rotatePattern {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            box-shadow: 0 0 80px rgba(0, 0, 0, 0.3);
        }

        .header {
            padding: 20px;
            border-bottom: 1px solid #1e293b;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 1.5rem;
            font-weight: 500;
        }

        #reset-btn {
            background: #334155;
            border: none;
            color: #cbd5e1;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
        }

        #reset-btn:hover {
            background: #475569;
        }

        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 16px;
            line-height: 1.5;
        }

        .user {
            background: #ffffff;
            color: #000000;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .assistant {
            background: #1e293b;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .input-area {
            padding: 20px;
            border-top: 1px solid #1e293b;
        }

        .input-wrapper {
            display: flex;
            gap: 12px;
        }

        #message-input {
            flex: 1;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 14px 16px;
            color: #e2e8f0;
            font-size: 1rem;
            outline: none;
        }

        #message-input:focus {
            border-color: #ffffff;
        }

        #send-btn {
            background: #ffffff;
            border: none;
            color: #000000;
            padding: 0 24px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 500;
        }

        #send-btn:disabled {
            background: #334155;
            cursor: not-allowed;
        }

        .status {
            font-size: 0.85rem;
            color: #64748b;
            margin-top: 8px;
        }

        .playing-indicator {
            font-size: 0.8rem;
            color: #ffffff;
            margin-top: 6px;
        }

        audio {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            
            <button id="reset-btn">Reset</button>
        </div>
        
        <div id="chat-container"></div>
        
        <div class="input-area">
            <div class="input-wrapper">
                <input id="message-input" type="text" placeholder="Type a message..." autocomplete="off">
                <button id="send-btn">Send</button>
            </div>
            <div class="status" id="status"></div>
        </div>
    </div>

    <audio id="audio-player"></audio>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const messageInput = document.getElementById('message-input');
        const sendBtn = document.getElementById('send-btn');
        const resetBtn = document.getElementById('reset-btn');
        const statusEl = document.getElementById('status');
        const audioPlayer = document.getElementById('audio-player');

        let isProcessing = false;

        function addMessage(text, isUser) {
            const msg = document.createElement('div');
            msg.className = `message ${isUser ? 'user' : 'assistant'}`;
            msg.textContent = text;
            chatContainer.appendChild(msg);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return msg;
        }

        function setStatus(text) {
            statusEl.textContent = text;
        }

        async function sendMessage() {
            if (isProcessing) return;
            
            const message = messageInput.value.trim();
            if (!message) return;

            isProcessing = true;
            sendBtn.disabled = true;
            messageInput.value = '';

            addMessage(message, true);
            setStatus('Thinking...');

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message })
                });

                if (!response.ok) throw new Error('Request failed');

                const data = await response.json();
                
                setStatus('Generating voice...');
                
                const assistantMsg = addMessage(data.text, false);
                
                // Play audio
                audioPlayer.src = data.audio_url;
                audioPlayer.play();
                
                const indicator = document.createElement('div');
                indicator.className = 'playing-indicator';
                indicator.textContent = '🔊 Speaking...';
                assistantMsg.appendChild(indicator);

                audioPlayer.onended = () => {
                    indicator.remove();
                };

                setStatus('');

            } catch (error) {
                addMessage('Sorry, something went wrong. Please try again.', false);
                setStatus('Error: ' + error.message);
            } finally {
                isProcessing = false;
                sendBtn.disabled = false;
                messageInput.focus();
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        resetBtn.addEventListener('click', async () => {
            await fetch('/reset', { method: 'DELETE' });
            chatContainer.innerHTML = '';
            setStatus('Conversation reset');
        });

        messageInput.focus();
    </script>
</body>
</html>
